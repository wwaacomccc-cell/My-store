<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>متجر الأدوات المنزلية</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d2330;--mut:#6b7280;--pri:#0f766e;--pri2:#115e59;--acc:#e11d48;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--tx:#eef0f4;--mut:#9aa3b2;--pri:#2dd4bf;--pri2:#5eead4;--acc:#fb7185;--bd:#2b3240}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--tx)}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:10px 12px;display:flex;gap:8px;align-items:center}
header h1{font-size:17px;margin:0;white-space:nowrap}
#q{flex:1;min-width:0;padding:10px 12px;border:0;border-radius:10px;font-size:15px}
.ib{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;padding:9px 11px;font-size:15px;position:relative}
.ib b{position:absolute;top:-6px;left:-6px;background:var(--acc);border-radius:99px;font-size:11px;padding:1px 6px}
#cats{display:flex;gap:8px;overflow-x:auto;padding:10px 12px}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:8px 14px;font-size:14px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:4px 12px 12px}
@media(min-width:700px){#grid{grid-template-columns:repeat(4,1fr)}}
.p{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--bd);cursor:pointer;position:relative}
.p img,.ph{width:100%;aspect-ratio:1;object-fit:cover;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:34px}
.p div.i{padding:8px 10px}.nm{font-size:14px;height:38px;overflow:hidden}
.pr{font-weight:700;color:var(--pri2)}.old{color:var(--mut);text-decoration:line-through;font-size:12px;margin-inline-start:6px}
.tag{position:absolute;top:8px;right:8px;background:var(--acc);color:#fff;font-size:12px;border-radius:8px;padding:2px 8px}
.out{opacity:.55}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px;font-size:15px;width:100%;font-weight:600}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
#more{display:block;margin:6px auto 24px;width:200px}
#md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20;align-items:flex-end;justify-content:center}
#md.on{display:flex}
#bx{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
@media(min-width:700px){#md{align-items:center}#bx{border-radius:18px}}
input,select,textarea{width:100%;padding:11px;margin:5px 0;border:1px solid var(--bd);border-radius:10px;font-size:15px;background:var(--card);color:var(--tx);font-family:inherit}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:30}
h3{margin:4px 0 10px}.mut{color:var(--mut);font-size:13px}.x{float:left;background:none;border:0;font-size:24px;color:var(--tx)}
</style>
</head>
<body>
<header>
  <h1 id="shop">🏠 المتجر</h1>
  <input id="q" type="search" placeholder="ابحث بالاسم أو الكود...">
  <button class="ib" id="acc">👤</button>
  <button class="ib" id="cartb">🛒<b id="cn">0</b></button>
</header>
<div id="cats"></div>
<div id="grid"></div>
<button class="btn g" id="more" style="display:none">عرض المزيد</button>
<div id="md"><div id="bx"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient('https://sdxoekoqwlpjylryvsey.supabase.co','sb_publishable_kC7hN0WhoW7JGpE4Xs6odA_sX6TY8yo');
const $ = id => document.getElementById(id), PAGE = 24;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => Number(n).toLocaleString('ar-EG') + ' ج';
let cats = [], offers = [], prods = {}, cart = {}, page = 0, cat = null, term = '', user = null, zones = [], settings = {};
try { cart = JSON.parse(localStorage.getItem('cart') || '{}'); } catch (e) {}

function toast(t) { const e = $('toast'); e.textContent = t; e.style.display = 'block'; setTimeout(() => e.style.display = 'none', 2600); }
function open_(h) { $('bx').innerHTML = '<button class="x" onclick="closeM()">×</button>' + h; $('md').classList.add('on'); }
function closeM() { $('md').classList.remove('on'); }
$('md').onclick = e => { if (e.target.id === 'md') closeM(); };

function price(p) {
  let d = 0;
  offers.forEach(o => { if (o.product_id === p.id || (o.category_id && o.category_id === p.category_id)) d = Math.max(d, Number(o.discount_percent)); });
  return { now: Math.round(p.price * (1 - d / 100) * 100) / 100, old: d ? p.price : null, d };
}
function saveCart() { try { localStorage.setItem('cart', JSON.stringify(cart)); } catch (e) {} $('cn').textContent = Object.values(cart).reduce((a, b) => a + b, 0); }

async function init() {
  const { data: { session } } = await sb.auth.getSession(); user = session?.user || null;
  sb.auth.onAuthStateChange((_, s) => user = s?.user || null);
  const [c, o, z, s] = await Promise.all([
    sb.from('categories').select('id,parent_id,name').eq('is_active', true).order('sort_order'),
    sb.from('offers').select('product_id,category_id,discount_percent').eq('is_active', true).lte('starts_at', new Date().toISOString()).gte('ends_at', new Date().toISOString()),
    sb.from('delivery_zones').select('id,name,fee').eq('is_active', true),
    sb.from('shop_settings').select('*').single()]);
  cats = c.data || []; offers = o.data || []; zones = z.data || []; settings = s.data || {};
  if (settings.shop_name) { $('shop').textContent = '🏠 ' + settings.shop_name; document.title = settings.shop_name; }
  drawCats(); saveCart(); load(true);
}
function drawCats() {
  const top = cats.filter(c => !c.parent_id);
  $('cats').innerHTML = `<button class="chip ${cat === null ? 'on' : ''}" data-c="">الكل</button>` +
    top.map(c => `<button class="chip ${cat === c.id ? 'on' : ''}" data-c="${c.id}">${esc(c.name)}</button>`).join('');
  $('cats').querySelectorAll('button').forEach(b => b.onclick = () => { cat = b.dataset.c ? +b.dataset.c : null; drawCats(); load(true); });
}
async function load(reset) {
  if (reset) { page = 0; $('grid').innerHTML = '<p class="mut" style="grid-column:1/-1;text-align:center">جاري التحميل...</p>'; }
  let q = sb.from('products').select('id,code,name,description,price,stock,category_id,product_images(url,sort_order)').eq('is_active', true).order('id', { ascending: false }).range(page * PAGE, page * PAGE + PAGE - 1);
  if (cat !== null) { const ids = [cat, ...cats.filter(c => c.parent_id === cat).map(c => c.id)]; q = q.in('category_id', ids); }
  if (term) { const t = term.replace(/[%,()]/g, ' '); q = q.or(`name.ilike.%${t}%,code.ilike.%${t}%`); }
  const { data, error } = await q;
  if (error) { toast('تعذر تحميل المنتجات'); return; }
  if (reset) $('grid').innerHTML = '';
  if (reset && !data.length) $('grid').innerHTML = '<p class="mut" style="grid-column:1/-1;text-align:center">لا توجد منتجات</p>';
  data.forEach(p => { prods[p.id] = p; $('grid').insertAdjacentHTML('beforeend', card(p)); });
  $('more').style.display = data.length === PAGE ? 'block' : 'none';
}
function img(p) { const im = (p.product_images || []).sort((a, b) => a.sort_order - b.sort_order)[0]; return im ? `<img loading="lazy" src="${esc(im.url)}" alt="">` : '<div class="ph">📦</div>'; }
function card(p) {
  const pr = price(p);
  return `<div class="p ${p.stock < 1 ? 'out' : ''}" onclick="showP(${p.id})">${pr.d ? `<span class="tag">-${pr.d}%</span>` : ''}${img(p)}
  <div class="i"><div class="nm">${esc(p.name)}</div><div><span class="pr">${money(pr.now)}</span>${pr.old ? `<span class="old">${money(pr.old)}</span>` : ''}</div>
  ${p.stock < 1 ? '<div class="mut">غير متوفر</div>' : ''}</div></div>`;
}
function showP(id) {
  const p = prods[id], pr = price(p), ims = (p.product_images || []).sort((a, b) => a.sort_order - b.sort_order);
  open_(`<div style="display:flex;gap:6px;overflow-x:auto">${ims.map(i => `<img src="${esc(i.url)}" style="height:220px;border-radius:12px">`).join('') || '<div class="ph" style="height:160px;width:100%;border-radius:12px">📦</div>'}</div>
  <h3>${esc(p.name)}</h3><div class="pr" style="font-size:20px">${money(pr.now)}${pr.old ? `<span class="old">${money(pr.old)}</span>` : ''}</div>
  <p class="mut">الكود: ${esc(p.code || '-')} • ${p.stock > 0 ? 'متوفر: ' + p.stock : 'غير متوفر'}</p><p>${esc(p.description || '')}</p>
  ${p.stock > 0 ? `<button class="btn" onclick="add(${p.id})">أضف إلى السلة</button>` : ''}
  <button class="btn g" style="margin-top:8px" onclick="reserve(${p.id})">احجز المنتج</button>`);
}
function add(id) { const p = prods[id]; const n = (cart[id] || 0) + 1; if (n > p.stock) return toast('الكمية المتاحة ' + p.stock); cart[id] = n; saveCart(); toast('تمت الإضافة ✓'); closeM(); }

function showCart() {
  const ids = Object.keys(cart).filter(i => prods[i]); let sub = 0;
  if (!ids.length) return open_('<h3>🛒 السلة</h3><p class="mut">السلة فارغة</p>');
  const rows = ids.map(i => { const p = prods[i], pr = price(p); sub += pr.now * cart[i];
    return `<div class="row"><div style="flex:1">${esc(p.name)}<div class="mut">${money(pr.now)}</div></div><div class="qty"><button onclick="chg(${i},1)">+</button> ${cart[i]} <button onclick="chg(${i},-1)">−</button></div></div>`; }).join('');
  open_(`<h3>🛒 السلة</h3>${rows}<div class="row"><b>الإجمالي</b><b>${money(sub)}</b></div>
  <button class="btn" style="margin-top:10px" onclick="checkout()">إتمام الطلب</button>`);
}
function chg(i, d) { const n = (cart[i] || 0) + d; if (n > prods[i].stock) return toast('الكمية المتاحة ' + prods[i].stock); if (n <= 0) delete cart[i]; else cart[i] = n; saveCart(); showCart(); }

function authForm(msg, after) {
  open_(`<h3>تسجيل الدخول</h3><p class="mut">${msg || ''}</p><input id="ae" type="email" placeholder="البريد الإلكتروني" dir="ltr"><input id="ap" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)" dir="ltr">
  <input id="an" placeholder="الاسم (للحساب الجديد)"><input id="aph" type="tel" placeholder="رقم الهاتف (للحساب الجديد)">
  <button class="btn" id="li">دخول</button><button class="btn g" style="margin-top:8px" id="su">إنشاء حساب جديد</button>`);
  $('li').onclick = async () => { const { error } = await sb.auth.signInWithPassword({ email: $('ae').value.trim(), password: $('ap').value }); if (error) return toast('بيانات غير صحيحة'); user = (await sb.auth.getUser()).data.user; closeM(); toast('تم الدخول ✓'); after && after(); };
  $('su').onclick = async () => { const { data, error } = await sb.auth.signUp({ email: $('ae').value.trim(), password: $('ap').value, options: { data: { full_name: $('an').value, phone: $('aph').value } } });
    if (error) return toast(error.message.slice(0, 60)); if (!data.session) return toast('افتح بريدك لتأكيد الحساب'); user = data.user; closeM(); toast('تم إنشاء الحساب ✓'); after && after(); };
}
async function checkout() {
  if (!user) return authForm('سجّل الدخول لإتمام الطلب', checkout);
  const { data: pf } = await sb.from('profiles').select('full_name,phone,address').eq('id', user.id).single();
  open_(`<h3>بيانات الطلب</h3><input id="cn_" placeholder="الاسم" value="${esc(pf?.full_name)}"><input id="cp" type="tel" placeholder="رقم الهاتف" value="${esc(pf?.phone)}">
  <textarea id="ca" rows="2" placeholder="العنوان بالتفصيل">${esc(pf?.address)}</textarea>
  <select id="cz"><option value="">اختر منطقة التوصيل</option>${zones.map(z => `<option value="${z.id}">${esc(z.name)} — ${money(z.fee)}</option>`).join('')}</select>
  <textarea id="cnt" rows="2" placeholder="ملاحظات (اختياري)"></textarea><p class="mut">الدفع نقدًا عند الاستلام</p><button class="btn" id="go">تأكيد الطلب</button>`);
  $('go').onclick = async () => {
    const name = $('cn_').value.trim(), ph = $('cp').value.trim(), ad = $('ca').value.trim(), z = $('cz').value;
    if (!name || !ph || !ad) return toast('أكمل الاسم والهاتف والعنوان'); if (zones.length && !z) return toast('اختر منطقة التوصيل');
    $('go').disabled = true;
    const items = Object.keys(cart).map(i => ({ product_id: +i, qty: cart[i] }));
    const { data, error } = await sb.rpc('place_order', { p_name: name, p_phone: ph, p_address: ad, p_zone_id: z ? +z : null, p_items: items, p_note: $('cnt').value });
    if (error) { $('go').disabled = false; return toast(error.message.slice(0, 80)); }
    await sb.from('profiles').update({ full_name: name, phone: ph, address: ad }).eq('id', user.id);
    cart = {}; saveCart(); open_(`<h3>✅ تم استلام طلبك</h3><p>رقم الطلب: <b>${data}</b></p><p class="mut">سيتواصل معك المحل لتأكيد الطلب.</p>`); load(true);
  };
}
const ST = { pending: 'قيد المراجعة', confirmed: 'تم التأكيد', preparing: 'جاري التجهيز', out_for_delivery: 'في الطريق', delivered: 'تم التسليم', rejected: 'مرفوض', cancelled: 'ملغي' };
async function account() {
  if (!user) return authForm('');
  const { data } = await sb.from('orders').select('id,total,status,created_at').order('id', { ascending: false }).limit(20);
  open_(`<h3>طلباتي</h3>${(data || []).map(o => `<div class="row"><div>طلب #${o.id}<div class="mut">${new Date(o.created_at).toLocaleDateString('ar-EG')}</div></div><div>${money(o.total)}<div class="mut">${ST[o.status] || o.status}</div></div></div>`).join('') || '<p class="mut">لا توجد طلبات</p>'}
  ${settings.whatsapp ? `<a href="https://wa.me/${esc(settings.whatsapp)}" target="_blank"><button class="btn g" style="margin-top:10px">💬 تواصل مع المحل</button></a>` : ''}
  <button class="btn g" style="margin-top:8px" id="lo">تسجيل الخروج</button>`);
  $('lo').onclick = async () => { await sb.auth.signOut(); user = null; closeM(); toast('تم الخروج'); };
}
async function reserve(id) {
  if (!user) return authForm('سجّل الدخول لحجز المنتج', () => reserve(id));
  const p = prods[id], pr = price(p), pc = Number(settings.default_deposit_percent || 20);
  const { data: pf } = await sb.from('profiles').select('full_name,phone').eq('id', user.id).single();
  open_(`<h3>حجز: ${esc(p.name)}</h3><p class="mut">العربون المطلوب (${pc}%): ${money(pr.now * pc / 100)} — والباقي عند الاستلام</p>
  <input id="rn" placeholder="الاسم" value="${esc(pf?.full_name)}"><input id="rp" type="tel" placeholder="الهاتف" value="${esc(pf?.phone)}"><button class="btn" id="rg">تأكيد الحجز</button>`);
  $('rg').onclick = async () => {
    if (!$('rn').value.trim() || !$('rp').value.trim()) return toast('أكمل البيانات');
    const exp = new Date(Date.now() + (settings.reservation_days || 3) * 864e5).toISOString();
    const { error } = await sb.from('reservations').insert({ customer_id: user.id, customer_name: $('rn').value.trim(), phone: $('rp').value.trim(), product_id: id, quantity: 1, unit_price: pr.now, deposit_required: Math.round(pr.now * pc) / 100, expires_at: exp });
    if (error) return toast('تعذر الحجز'); open_('<h3>✅ تم إرسال طلب الحجز</h3><p class="mut">سيتواصل معك المحل لتأكيده واستلام العربون.</p>');
  };
}

let tm; $('q').oninput = e => { clearTimeout(tm); tm = setTimeout(() => { term = e.target.value.trim(); load(true); }, 350); };
$('more').onclick = () => { page++; load(false); };
$('cartb').onclick = showCart; $('acc').onclick = account;
init();
</script>
</body>
</html>
