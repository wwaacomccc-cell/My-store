<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم</title>
<style>
:root{--bg:#eef3fb;--card:#fff;--tx:#14213d;--mut:#64748b;--pri:#1746b0;--acc:#e11d2e;--bd:#dde6f5}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--tx:#eef2fb;--mut:#9aa8c2;--pri:#4c86ff;--acc:#ff5468;--bd:#22304a}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--pri);color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0}header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:7px 12px}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:10px;position:sticky;top:48px;background:var(--bg);z-index:4}
#tabs button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:8px 14px;font-size:14px}
#tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
#main{padding:0 10px 40px;max-width:760px;margin:auto}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:13px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.d{background:var(--acc)}.btn.w{width:100%;margin-top:6px}
input,select,textarea{width:100%;padding:11px;margin:4px 0;border:1px solid var(--bd);border-radius:10px;font-size:15px;background:var(--card);color:var(--tx);font-family:inherit}
label{font-size:13px;color:var(--mut)}
#md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20;align-items:flex-end;justify-content:center}#md.on{display:flex}
#bx{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px}
.x{float:left;background:none;border:0;font-size:24px;color:var(--tx)}
.th{width:64px;height:64px;object-fit:cover;border-radius:8px}.imgs{display:flex;gap:8px;overflow-x:auto;margin:6px 0}
.imgs div{position:relative;flex:none}.imgs button{position:absolute;top:-4px;right:-4px;background:var(--acc);color:#fff;border:0;border-radius:99px;width:22px;height:22px}
#tabs button{position:relative}
.bdg{position:absolute;top:-6px;left:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:#dc2626;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--bg)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:30}
h3{margin:8px 0}.bad{color:var(--acc)}
header{background:linear-gradient(135deg,#0f3a99,#1f64e0);box-shadow:0 4px 16px rgba(15,58,153,.25)}
header h1{color:#ffd21f;font-weight:800}
#tabs button{font-weight:600}
#tabs button.on{background:linear-gradient(135deg,#0f3a99,#1f64e0);border-color:transparent}
.c{border:0;border-radius:16px;box-shadow:0 2px 10px rgba(15,40,100,.10)}
.btn{background:linear-gradient(135deg,#0f3a99,#1f64e0);border-radius:12px}
.btn.g{background:var(--card)}.btn.d{background:var(--acc)}
#bx{border-radius:24px 24px 0 0}

/* ===== الشكل الجديد (أزرق وأصفر، كروت أنعم) ===== */
:root{--bg:#f3f6fb;--card:#fff;--tx:#14213d;--mut:#5b6b82;--pri:#1f64e0;--acc:#dc2626;--bd:#e2e8f3}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--tx:#eef2fb;--mut:#9aa8c2;--pri:#4c86ff;--acc:#ff5468;--bd:#22304a}}
header{background:#0f3a99}
header h1{color:#ffd33d;font-weight:600}
#tabs button.on{background:#1f64e0;border-color:#1f64e0}
.c{border-radius:14px;box-shadow:0 2px 8px rgba(15,40,100,.06)}
.btn{border-radius:12px}
</style>
</head>
<body>
<header><h1>⚙️ لوحة التحكم</h1><button id="out" style="display:none">خروج</button></header>
<div id="tabs"></div>
<div id="main"></div>
<div id="md"><div id="bx"></div></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient('https://sdxoekoqwlpjylryvsey.supabase.co','sb_publishable_kC7hN0WhoW7JGpE4Xs6odA_sX6TY8yo');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => Number(n || 0).toLocaleString('ar-EG') + ' ج';
const ST = { pending: 'قيد المراجعة', confirmed: 'تم التأكيد', preparing: 'جاري التجهيز', out_for_delivery: 'في الطريق', delivered: 'تم التسليم', rejected: 'مرفوض', cancelled: 'ملغي' };
const RS = { pending: 'جديد', confirmed: 'مؤكد', completed: 'مكتمل', expired: 'منتهي', cancelled: 'ملغي' };
let cats = [], tab = 'orders';
function toast(t) { const e = $('toast'); e.textContent = t; e.style.display = 'block'; setTimeout(() => e.style.display = 'none', 2800); }
function modal(h) { $('bx').innerHTML = '<button class="x" onclick="closeM()">×</button>' + h; $('md').classList.add('on'); }
function closeM() { $('md').classList.remove('on'); }
$('md').onclick = e => { if (e.target.id === 'md') closeM(); };
const opts = (o, sel) => Object.entries(o).map(([k, v]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${v}</option>`).join('');
const catOpts = sel => '<option value="">بدون قسم</option>' + cats.map(c => `<option value="${c.id}" ${c.id == sel ? 'selected' : ''}>${esc(c.name)}</option>`).join('');

const TABS = { orders: 'الطلبات', res: 'الحجوزات', prods: 'المنتجات', cats: 'الأقسام', offers: 'العروض', zones: 'التوصيل', rep: 'التقارير', notif: 'إشعارات', cust: 'العملاء', rev: 'التقييمات', post: 'المنشورات', msg: 'الرسائل', cmt: 'التعليقات', bk: 'نسخة احتياطية', set: 'الإعدادات' };
const BADGE = {};
function drawTabs() { $('tabs').innerHTML = Object.entries(TABS).map(([k, v]) => `<button class="${k === tab ? 'on' : ''}" onclick="go('${k}')">${v}${BADGE[k] ? `<span class="bdg">${BADGE[k]}</span>` : ''}</button>`).join(''); }
// الأعداد: الجديد منذ آخر زيارة للتبويب، والتقييمات بتعد اللي بانتظار الموافقة
const BADGE_SRC = { orders: 'orders', res: 'reservations', cmt: 'product_comments' };
async function maxId(table) { const { data } = await sb.from(table).select('id').order('id', { ascending: false }).limit(1); return data && data[0] ? data[0].id : 0; }
async function markSeen(k) { if (BADGE_SRC[k]) localStorage.setItem('seen_' + k, await maxId(BADGE_SRC[k])); BADGE[k] = 0; drawTabs(); }
async function refreshBadges() {
  for (const k of Object.keys(BADGE_SRC)) {
    const key = 'seen_' + k;
    if (localStorage.getItem(key) === null) localStorage.setItem(key, await maxId(BADGE_SRC[k]));
    const { count } = await sb.from(BADGE_SRC[k]).select('id', { count: 'exact', head: true }).gt('id', +localStorage.getItem(key));
    BADGE[k] = k === tab ? 0 : (count || 0);
  }
  const { count: pr } = await sb.from('reviews').select('id', { count: 'exact', head: true }).eq('is_approved', false);
  BADGE.rev = pr || 0;
  const { count: um } = await sb.from('messages').select('id', { count: 'exact', head: true }).eq('from_admin', false).eq('is_read', false);
  BADGE.msg = um || 0;
  drawTabs();
}
async function go(t) { tab = t; BADGE[t] = 0; drawTabs(); $('main').innerHTML = '<p class="mut">جاري التحميل...</p>'; await V[t](); markSeen(t); }

/* ---------- دخول ---------- */
function loginForm(msg) {
  $('tabs').innerHTML = ''; $('out').style.display = 'none';
  $('main').innerHTML = `<div class="c"><h3>دخول صاحب المحل</h3><p class="bad">${msg || ''}</p><input id="e" type="email" placeholder="البريد الإلكتروني" dir="ltr"><input id="p" type="password" placeholder="كلمة المرور" dir="ltr"><button class="btn w" id="li">دخول</button></div>`;
  $('li').onclick = async () => { const { error } = await sb.auth.signInWithPassword({ email: $('e').value.trim(), password: $('p').value }); if (error) return toast('بيانات غير صحيحة'); start(); };
}
$('out').onclick = async () => { await sb.auth.signOut(); loginForm(); };
async function start() {
  const { data: { user } } = await sb.auth.getUser(); if (!user) return loginForm();
  const { data: pf } = await sb.from('profiles').select('role').eq('id', user.id).single();
  if (!pf || pf.role !== 'admin') return loginForm('هذا الحساب ليس حساب إدارة');
  $('out').style.display = 'block';
  cats = (await sb.from('categories').select('*').order('sort_order').order('id')).data || [];
  go('orders');
  refreshBadges(); setInterval(refreshBadges, 60000);
}

const V = {};
/* ---------- الطلبات ---------- */
let ordPage = 0; const PG = 50;
const ordRow = o => `<div class="c" onclick="orderM(${o.id})"><div class="r"><b>طلب #${o.id} — ${esc(o.customer_name)}</b><span>${money(o.total)}</span></div>
  <div class="r mut"><span>${new Date(o.created_at).toLocaleString('ar-EG')}</span><span class="${o.status === 'pending' ? 'bad' : ''}">${ST[o.status]}</span></div></div>`;
async function ordMore() {
  const { data } = await sb.from('orders').select('*').order('id', { ascending: false }).range(ordPage * PG, ordPage * PG + PG - 1);
  const box = $('ordl'); if (!box) return;
  if (ordPage === 0 && !(data || []).length) box.innerHTML = '<p class="mut">لا توجد طلبات</p>';
  else box.insertAdjacentHTML('beforeend', (data || []).map(ordRow).join(''));
  const b = $('ordmore'); if (b) b.style.display = (data || []).length < PG ? 'none' : '';
  ordPage++;
}
V.orders = async () => {
  ordPage = 0;
  $('main').innerHTML = '<div id="ordl"></div><button class="btn g w" id="ordmore">تحميل المزيد</button>';
  $('ordmore').onclick = ordMore;
  await ordMore();
};
async function orderM(id) {
  const [{ data: o }, { data: it }, { data: pr }] = await Promise.all([sb.from('orders').select('*').eq('id', id).single(), sb.from('order_items').select('*').eq('order_id', id), sb.from('payment_proofs').select('url').eq('order_id', id)]);
  modal(`<h3>طلب #${o.id}</h3><p>${esc(o.customer_name)} — <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a><br>${esc(o.address)}</p>${o.note ? `<p class="mut">ملاحظة: ${esc(o.note)}</p>` : ''}
  ${(pr || []).length ? `<p><b>📎 صور التحويل:</b></p>` + pr.map(x => `<a href="${esc(x.url)}" target="_blank"><img src="${esc(x.url)}" style="max-width:100%;max-height:260px;border-radius:8px;margin:4px 0"></a>`).join('') : ''}
  ${it.map(i => `<div class="r"><span>${esc(i.product_name)} × ${i.quantity}</span><span>${money(i.unit_price * i.quantity)}</span></div>`).join('')}
  <div class="r mut"><span>التوصيل</span><span>${money(o.delivery_fee)}</span></div><div class="r"><b>الإجمالي</b><b>${money(o.total)}</b></div>
  <label>تعديل رسوم التوصيل</label><input id="df" type="number" value="${o.delivery_fee}"><label>حالة الطلب</label><select id="os">${opts(ST, o.status)}</select><button class="btn w" id="sv">حفظ</button><button class="btn g w" id="inv">📲 إرسال الفاتورة واتساب</button>`);
  $('inv').onclick = async () => { const { data: s } = await sb.from('shop_settings').select('shop_name').single(); const tx = `فاتورة طلب #${o.id} — ${s?.shop_name || ''}\nالعميل: ${o.customer_name}\n` + it.map(i => `• ${i.product_name} × ${i.quantity} = ${money(i.unit_price * i.quantity)}`).join('\n') + `\nالتوصيل: ${money(o.delivery_fee)}\nالإجمالي: ${money(o.total)}\nالدفع عند الاستلام\nشكرًا لتعاملكم معنا`; window.open('https://wa.me/' + wa(o.phone) + '?text=' + encodeURIComponent(tx), '_blank'); };
  $('sv').onclick = async () => {
    const fee = Number($('df').value || 0);
    const { error } = await sb.from('orders').update({ status: $('os').value, delivery_fee: fee, total: Number(o.subtotal) + fee }).eq('id', id);
    if (error) return toast(error.message.includes('stock') || error.code === '23514' ? 'الكمية في المخزون لا تكفي' : 'تعذر الحفظ'); closeM(); toast('تم الحفظ ✓'); V.orders();
  };
}
/* ---------- الحجوزات ---------- */
V.res = async () => {
  const { data } = await sb.from('reservations').select('*,products(name),payments(amount)').order('id', { ascending: false }).limit(50);
  const { data: pf } = await sb.from('payment_proofs').select('reservation_id,url').not('reservation_id', 'is', null); const PF = {}; (pf || []).forEach(x => (PF[x.reservation_id] = PF[x.reservation_id] || []).push(x.url));
  $('main').innerHTML = (data || []).map(r => { const paid = (r.payments || []).reduce((a, b) => a + Number(b.amount), 0), tot = r.unit_price * r.quantity;
    return `<div class="c"><div class="r"><b>${esc(r.products?.name)} × ${r.quantity}</b><span>${RS[r.status]}</span></div><div class="mut">${esc(r.customer_name)} — ${esc(r.phone)}</div>
    <div class="mut">الإجمالي ${money(tot)} • العربون المطلوب ${money(r.deposit_required)} • المدفوع ${money(paid)} • المتبقي ${money(tot - paid)}</div>
    <div class="r" style="margin-top:6px"><select onchange="resSt(${r.id},this.value)">${opts(RS, r.status)}</select><button class="btn g" onclick="addPay(${r.id})">+ عربون</button></div>${(PF[r.id] || []).map(u => `<a href="${esc(u)}" target="_blank"><img src="${esc(u)}" style="max-width:100%;max-height:200px;border-radius:8px;margin-top:6px"></a>`).join('')}</div>`; }).join('') || '<p class="mut">لا توجد حجوزات</p>';
};
async function resSt(id, s) { await sb.from('reservations').update({ status: s }).eq('id', id); toast('تم ✓'); }
async function addPay(id) { const a = Number(prompt('المبلغ المدفوع')); if (!a) return; const { error } = await sb.from('payments').insert({ reservation_id: id, amount: a, kind: 'deposit' }); if (error) return toast('تعذر التسجيل'); toast('تم تسجيل الدفعة ✓'); V.res(); }

/* ---------- المنتجات ---------- */
let pq = '';
V.prods = async () => {
  let q = sb.from('products').select('id,code,name,price,stock,is_active,product_images(url)').order('id', { ascending: false }).limit(60);
  if (pq) { const t = pq.replace(/[%,()]/g, ' '); q = q.or(`name.ilike.%${t}%,code.ilike.%${t}%`); }
  const { data } = await q;
  $('main').innerHTML = `<div class="r"><input id="ps" placeholder="بحث بالاسم أو الكود" value="${esc(pq)}"><button class="btn" onclick="prodM()">+ منتج</button></div>` +
    (data || []).map(p => `<div class="c r" onclick="prodM(${p.id})" style="${p.is_active ? '' : 'opacity:.5'}"><div class="r" style="gap:10px">${p.product_images?.[0] ? `<img class="th" src="${esc(p.product_images[0].url)}">` : '<div class="th" style="background:var(--bd)"></div>'}
    <div><b>${esc(p.name)}</b><div class="mut">${esc(p.code || '')} • مخزون: ${p.stock}${p.is_active ? '' : ' • مخفي'}</div></div></div><b>${money(p.price)}</b></div>`).join('');
  let t; $('ps').oninput = e => { clearTimeout(t); t = setTimeout(() => { pq = e.target.value.trim(); V.prods(); }, 500); };
};
async function prodM(id) {
  let p = { name: '', code: '', price: '', cost_price: '', stock: 0, description: '', category_id: '', is_active: true }, imgs = [];
  if (id) { p = (await sb.from('products').select('*').eq('id', id).single()).data; imgs = (await sb.from('product_images').select('*').eq('product_id', id).order('sort_order')).data || []; }
  modal(`<h3>${id ? 'تعديل منتج' : 'منتج جديد'}</h3><label>الاسم</label><input id="n" value="${esc(p.name)}"><label>الكود</label><input id="c" value="${esc(p.code)}">
  <label>القسم</label><select id="k">${catOpts(p.category_id)}</select><label>سعر البيع</label><input id="pr" type="number" value="${p.price}"><label>سعر الشراء (للأرباح)</label><input id="cp" type="number" value="${p.cost_price}">
  <label>الكمية في المخزون</label><input id="s" type="number" value="${p.stock}"><label>الوصف</label><textarea id="d" rows="3">${esc(p.description)}</textarea>
  <label><input type="checkbox" id="a" ${p.is_active ? 'checked' : ''} style="width:auto"> ظاهر في المتجر</label>
  <div class="imgs" id="im">${imgs.map(i => `<div><img class="th" src="${esc(i.url)}"><button onclick="delImg(${i.id},'${esc(i.url)}',${id})">×</button></div>`).join('')}</div>
  <label>إضافة صور</label><input id="f" type="file" accept="image/*" multiple><button class="btn w" id="sv">حفظ</button>${id ? '<button class="btn d w" id="dl">حذف المنتج</button>' : ''}`);
  $('sv').onclick = async () => {
    const row = { name: $('n').value.trim(), code: $('c').value.trim() || null, category_id: $('k').value || null, price: Number($('pr').value), cost_price: Number($('cp').value || 0), stock: parseInt($('s').value || 0), description: $('d').value, is_active: $('a').checked };
    if (!row.name || isNaN(row.price)) return toast('اكتب الاسم والسعر');
    $('sv').disabled = true; $('sv').textContent = 'جاري الحفظ...';
    let pid = id, error;
    if (id) ({ error } = await sb.from('products').update(row).eq('id', id));
    else { const r = await sb.from('products').insert(row).select('id').single(); error = r.error; pid = r.data?.id; }
    if (error) { $('sv').disabled = false; $('sv').textContent = 'حفظ'; return toast(error.code === '23505' ? 'الكود مستخدم من قبل' : 'تعذر الحفظ'); }
    const files = [...$('f').files];
    for (let i = 0; i < files.length; i++) {
      const b = await compress(files[i]), path = `${pid}/${Date.now()}_${i}.webp`;
      const up = await sb.storage.from('product-images').upload(path, b, { contentType: 'image/webp' });
      if (up.error) { toast('تعذر رفع صورة'); continue; }
      await sb.from('product_images').insert({ product_id: pid, url: sb.storage.from('product-images').getPublicUrl(path).data.publicUrl, sort_order: imgs.length + i });
    }
    closeM(); toast('تم الحفظ ✓'); V.prods();
  };
  if (id) $('dl').onclick = async () => { if (!confirm('حذف المنتج نهائيًا؟ (الأفضل إخفاؤه)')) return; const { error } = await sb.from('products').delete().eq('id', id); if (error) return toast('لا يمكن الحذف لوجود طلبات عليه، اخفِه بدلًا من ذلك'); closeM(); V.prods(); };
}
function compress(file) { return new Promise(res => { const im = new Image(); im.onload = () => { const r = Math.min(1, 900 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * r; c.height = im.height * r; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); c.toBlob(b => res(b), 'image/webp', .8); }; im.src = URL.createObjectURL(file); }); }
async function delImg(iid, url, pid) { await sb.from('product_images').delete().eq('id', iid); const k = url.split('/product-images/')[1]; if (k) await sb.storage.from('product-images').remove([k]); prodM(pid); }

/* ---------- الأقسام ---------- */
V.cats = async () => {
  cats = (await sb.from('categories').select('*').order('sort_order').order('id')).data || [];
  $('main').innerHTML = `<div class="c"><h3>قسم جديد</h3><input id="cn" placeholder="اسم القسم"><select id="cpar"><option value="">قسم رئيسي</option>${cats.filter(c => !c.parent_id).map(c => `<option value="${c.id}">فرعي من: ${esc(c.name)}</option>`).join('')}</select><button class="btn w" id="ca">إضافة</button></div>` +
    cats.map(c => `<div class="c r"><span>${c.parent_id ? '↳ ' : ''}<b>${esc(c.name)}</b>${c.is_active ? '' : ' <span class="mut">(مخفي)</span>'}</span><span><button class="btn g" onclick="catTog(${c.id},${!c.is_active})">${c.is_active ? 'إخفاء' : 'إظهار'}</button> <button class="btn g" onclick="catRen(${c.id})">اسم</button></span></div>`).join('');
  $('ca').onclick = async () => { const n = $('cn').value.trim(); if (!n) return toast('اكتب الاسم'); const { error } = await sb.from('categories').insert({ name: n, parent_id: $('cpar').value || null }); if (error) return toast('تعذر'); toast('تمت الإضافة ✓'); V.cats(); };
};
async function catTog(id, v) { await sb.from('categories').update({ is_active: v }).eq('id', id); V.cats(); }
async function catRen(id) { const n = prompt('الاسم الجديد'); if (!n) return; await sb.from('categories').update({ name: n }).eq('id', id); V.cats(); }

/* ---------- العروض ---------- */
V.offers = async () => {
  const { data } = await sb.from('offers').select('*,products(name),categories(name)').order('id', { ascending: false }).limit(40);
  $('main').innerHTML = `<div class="c"><h3>عرض جديد</h3><input id="ot" placeholder="عنوان العرض"><label>على قسم كامل</label><select id="oc">${catOpts('')}</select><label>أو على منتج (اكتب الكود)</label><input id="op" placeholder="كود المنتج">
  <input id="od" type="number" placeholder="نسبة الخصم %"><input id="ol" type="number" placeholder="مدة العرض بالأيام" value="7"><button class="btn w" id="oa">إنشاء العرض</button></div>` +
    (data || []).map(o => { const act = o.is_active && new Date(o.ends_at) > new Date(); return `<div class="c r"><div><b>${esc(o.title)}</b> — ${o.discount_percent}%<div class="mut">${esc(o.products?.name || o.categories?.name)} • حتى ${new Date(o.ends_at).toLocaleDateString('ar-EG')} ${act ? '' : '(منتهي)'}</div></div><button class="btn g" onclick="offDel(${o.id})">حذف</button></div>`; }).join('');
  $('oa').onclick = async () => {
    const pct = Number($('od').value), code = $('op').value.trim(); let pid = null;
    if (!$('ot').value.trim() || !(pct > 0 && pct < 100)) return toast('اكتب العنوان والنسبة');
    if (code) { const r = await sb.from('products').select('id').eq('code', code).maybeSingle(); if (!r.data) return toast('الكود غير موجود'); pid = r.data.id; }
    if (!pid && !$('oc').value) return toast('اختر قسمًا أو منتجًا');
    const { error } = await sb.from('offers').insert({ title: $('ot').value.trim(), product_id: pid, category_id: pid ? null : +$('oc').value, discount_percent: pct, ends_at: new Date(Date.now() + (Number($('ol').value) || 7) * 864e5).toISOString() });
    if (error) return toast('تعذر'); toast('تم إنشاء العرض ✓'); V.offers();
  };
};
async function offDel(id) { await sb.from('offers').delete().eq('id', id); V.offers(); }

/* ---------- التوصيل ---------- */
V.zones = async () => {
  const { data } = await sb.from('delivery_zones').select('*').order('id');
  $('main').innerHTML = `<div class="c"><h3>منطقة جديدة</h3><input id="zn" placeholder="اسم المنطقة"><input id="zf" type="number" placeholder="رسوم التوصيل"><button class="btn w" id="za">إضافة</button></div>` +
    (data || []).map(z => `<div class="c r"><span><b>${esc(z.name)}</b> — ${money(z.fee)}${z.is_active ? '' : ' (متوقفة)'}</span><span><button class="btn g" onclick="zFee(${z.id})">الرسوم</button> <button class="btn g" onclick="zTog(${z.id},${!z.is_active})">${z.is_active ? 'إيقاف' : 'تفعيل'}</button></span></div>`).join('');
  $('za').onclick = async () => { if (!$('zn').value.trim()) return toast('اكتب الاسم'); await sb.from('delivery_zones').insert({ name: $('zn').value.trim(), fee: Number($('zf').value || 0) }); V.zones(); };
};
async function zFee(id) { const f = prompt('الرسوم الجديدة'); if (f === null) return; await sb.from('delivery_zones').update({ fee: Number(f) }).eq('id', id); V.zones(); }
async function zTog(id, v) { await sb.from('delivery_zones').update({ is_active: v }).eq('id', id); V.zones(); }

/* ---------- التقارير ---------- */
V.rep = async () => {
  const usageP = sb.rpc('store_usage');
  const [d, t, e] = await Promise.all([sb.from('daily_sales').select('*').limit(14), sb.from('top_products').select('*').limit(10), sb.from('expenses').select('*').order('id', { ascending: false }).limit(10)]);
  const rev = (d.data || []).reduce((a, b) => a + Number(b.revenue), 0), pf = (d.data || []).reduce((a, b) => a + Number(b.profit), 0), ex = (e.data || []).reduce((a, b) => a + Number(b.amount), 0);
  $('main').innerHTML = `<div class="c"><h3>آخر 14 يوم</h3><div class="r"><span>المبيعات</span><b>${money(rev)}</b></div><div class="r"><span>الربح (قبل المصروفات)</span><b>${money(pf)}</b></div><div class="r"><span>آخر المصروفات المسجلة</span><b>${money(ex)}</b></div></div>
  <div class="c"><h3>يوميًا</h3>${(d.data || []).map(x => `<div class="r mut"><span>${x.day} (${x.orders_count} طلب)</span><span>${money(x.revenue)}</span></div>`).join('') || '<p class="mut">لا توجد مبيعات مؤكدة بعد</p>'}</div>
  <div class="c"><h3>الأكثر مبيعًا</h3>${(t.data || []).map(x => `<div class="r"><span>${esc(x.product_name)}</span><b>${x.sold}</b></div>`).join('') || '<p class="mut">—</p>'}</div>
  <div class="c"><h3>مصروف جديد</h3><input id="et" placeholder="البند (إيجار، كهرباء...)"><input id="ea" type="number" placeholder="المبلغ"><button class="btn w" id="eb">تسجيل</button>
  ${(e.data || []).map(x => `<div class="r mut"><span>${esc(x.title)} • ${x.spent_at}</span><span>${money(x.amount)}</span></div>`).join('')}</div>`;
  $('eb').onclick = async () => { const a = Number($('ea').value); if (!$('et').value.trim() || !(a > 0)) return toast('أكمل البيانات'); await sb.from('expenses').insert({ title: $('et').value.trim(), amount: a }); V.rep(); };
  const u = (await usageP).data;
  if (u) {
    const MB = 1024 * 1024, LIM_DB = 500 * MB, LIM_ST = 1024 * MB;
    const bar = (v, lim) => { const p = Math.min(100, Math.round(v / lim * 100)); return `<div style="background:var(--bd);border-radius:99px;height:8px;margin:6px 0"><div style="background:${p > 85 ? '#dc2626' : '#1f64e0'};width:${p}%;height:8px;border-radius:99px"></div></div>`; };
    $('main').insertAdjacentHTML('afterbegin', `<div class="c"><h3>مساحة المتجر</h3>
      <div class="r"><span>قاعدة البيانات</span><b>${(u.db_bytes / MB).toFixed(1)} من 500 ميجا</b></div>${bar(u.db_bytes, LIM_DB)}
      <div class="r"><span>الصور والملفات</span><b>${(u.storage_bytes / MB).toFixed(1)} من 1024 ميجا</b></div>${bar(u.storage_bytes, LIM_ST)}
      <p class="mut">لو الشريط اتلون بالأحمر، امسح الطلبات القديمة أو صور التحويل اللي خلصت.</p></div>`);
  }
};

/* ---------- الإشعارات ---------- */
V.notif = async () => {
  const { data } = await sb.from('notifications').select('*').order('id', { ascending: false }).limit(10);
  $('main').innerHTML = `<div class="c"><h3>إشعار لكل العملاء</h3><input id="nt" placeholder="العنوان"><textarea id="nb" rows="3" placeholder="النص"></textarea><button class="btn w" id="ns">إرسال</button></div>` +
    (data || []).map(n => `<div class="c"><b>${esc(n.title)}</b><div class="mut">${esc(n.body)}</div></div>`).join('');
  $('ns').onclick = async () => { if (!$('nt').value.trim()) return toast('اكتب العنوان'); await sb.from('notifications').insert({ title: $('nt').value.trim(), body: $('nb').value }); toast('تم الإرسال ✓'); V.notif(); };
};
/* ---------- التقييمات ---------- */
V.rev = async () => {
  const { data } = await sb.from('reviews').select('*').order('id', { ascending: false }).limit(100);
  $('main').innerHTML = (data || []).map(r => `<div class="c"><div class="r"><b>${esc(r.name)} <span style="color:#f5a623">${'★'.repeat(r.rating)}</span></b><span class="${r.is_approved ? '' : 'bad'}">${r.is_approved ? 'ظاهر للعملاء' : 'بانتظار الموافقة'}</span></div><div class="mut">${esc(r.comment)}</div><div class="r" style="margin-top:6px"><button class="btn g" onclick="revSet(${r.id},${!r.is_approved})">${r.is_approved ? 'إخفاء' : 'موافقة ✓'}</button><button class="btn d" onclick="revDel(${r.id})">حذف</button></div></div>`).join('') || '<p class="mut">لا توجد تقييمات بعد</p>';
};
/* ---------- الرسائل (مراسلة العملاء) ---------- */
V.msg = async () => {
  const { data } = await sb.from('messages').select('id,user_id,body,from_admin,is_read,created_at').order('id', { ascending: false }).limit(500);
  const ids = [...new Set((data || []).map(m => m.user_id))];
  const { data: pr } = ids.length ? await sb.from('profiles').select('id,full_name').in('id', ids) : { data: [] };
  const NM = {}; (pr || []).forEach(p => NM[p.id] = p.full_name || 'عميل');
  const T = {}; (data || []).forEach(m => { const t = T[m.user_id] = T[m.user_id] || { last: m, unread: 0 }; if (!m.from_admin && !m.is_read) t.unread++; });
  $('main').innerHTML = ids.map(id => { const t = T[id]; return `<div class="c" style="cursor:pointer" onclick="msgThread('${id}')"><div class="r"><b>${esc(NM[id])}</b>${t.unread ? `<span class="bdg" style="position:static">${t.unread}</span>` : ''}</div><div class="mut">${esc(t.last.body).slice(0, 60)}</div></div>`; }).join('') || '<p class="mut">لا توجد رسائل</p>';
};
async function msgThread(uid) {
  const { data } = await sb.from('messages').select('*').eq('user_id', uid).order('id').limit(200);
  await sb.from('messages').update({ is_read: true }).eq('user_id', uid).eq('from_admin', false).eq('is_read', false);
  const { data: p } = await sb.from('profiles').select('full_name').eq('id', uid).maybeSingle();
  $('main').innerHTML = `<button class="btn g" onclick="V.msg()">← رجوع</button><h3>${esc(p?.full_name || 'عميل')}</h3><div id="th" style="max-height:55vh;overflow-y:auto">${(data || []).map(m => `<div class="row" style="${m.from_admin ? 'justify-content:flex-start' : 'justify-content:flex-end'}"><div style="max-width:80%;background:${m.from_admin ? '#dcfce7' : '#e8f0ff'};padding:8px 10px;border-radius:10px">${esc(m.body)}<div class="mut" style="font-size:11px">${new Date(m.created_at).toLocaleString('ar-EG')}</div></div></div>`).join('')}</div><textarea id="mt" rows="2" maxlength="1000" placeholder="اكتب ردك..."></textarea><button class="btn w" onclick="msgSend('${uid}')">إرسال</button>`;
  $('th').scrollTop = $('th').scrollHeight;
}
async function msgSend(uid) {
  const t = ($('mt').value || '').trim(); if (!t) return toast('اكتب الرسالة');
  const { error } = await sb.from('messages').insert({ user_id: uid, from_admin: true, is_read: true, body: t.slice(0, 1000) });
  if (error) return toast('تعذر الإرسال');
  await sb.from('notifications').insert({ user_id: uid, title: 'رسالة من صاحب المحل', body: t.slice(0, 120) });
  msgThread(uid);
}
/* ---------- المنشورات ---------- */
V.post = async () => {
  $('main').innerHTML = '<div class="c"><textarea id="pt" rows="3" maxlength="500" placeholder="اكتب منشور للمتجر (عرض، خبر، ...)"></textarea><button class="btn w" id="pb">نشر المنشور</button></div><div id="pl"></div>';
  $('pb').onclick = async () => {
    const t = ($('pt').value || '').trim(); if (!t) return toast('اكتب المنشور');
    const { error } = await sb.from('posts').insert({ body: t });
    if (error) return toast('تعذر النشر: ' + error.message); toast('تم النشر ✓'); V.post();
  };
  const { data } = await sb.from('posts').select('*').order('id', { ascending: false }).limit(200);
  $('pl').innerHTML = (data || []).map(p => `<div class="c"><div class="mut">${new Date(p.created_at).toLocaleString('ar-EG')}${p.is_visible ? '' : ' • مخفي'}</div><div>${esc(p.body)}</div><div class="r" style="margin-top:6px"><button class="btn g" onclick="postSet(${p.id},${!p.is_visible})">${p.is_visible ? 'إخفاء' : 'إظهار'}</button><button class="btn g" onclick="postDel(${p.id})">حذف</button></div></div>`).join('') || '<p class="mut">لا توجد منشورات</p>';
};
async function postSet(id, v) { await sb.from('posts').update({ is_visible: v }).eq('id', id); V.post(); }
async function postDel(id) { if (!confirm('حذف المنشور؟')) return; await sb.from('posts').delete().eq('id', id); V.post(); }
/* ---------- إعدادات المتجر ---------- */
V.set = async () => {
  const { data: s } = await sb.from('shop_settings').select('*').eq('id', 1).single();
  const f = (s && s.features) || {};
  const chk = (k, label, def) => `<label style="display:flex;gap:8px;align-items:center;margin:8px 0"><input type="checkbox" id="f_${k}" ${(f[k] === undefined ? def : f[k]) ? 'checked' : ''} style="width:auto"> ${label}</label>`;
  $('main').innerHTML = `<div class="c"><h3>إعدادات المتجر</h3>
    <label class="mut">اسم المحل</label><input id="s_name" value="${esc(s?.shop_name || '')}">
    <label class="mut">واتساب (بالكود الدولي بدون +، مثال 201xxxxxxxxx)</label><input id="s_wa" value="${esc(s?.whatsapp || '')}">
    <label class="mut">عنوان البانر (السطر الأول)</label><input id="s_ht" value="${esc(f.hero_title || 'كل ما تحتاجه لمنزلك')}">
    <label class="mut">عنوان البانر (السطر الثاني)</label><input id="s_hs" value="${esc(f.hero_sub || 'في مكان واحد')}">
    <h4 style="margin-top:14px">إظهار الأقسام في المتجر</h4>
    ${chk('discovery', 'مركز اكتشاف المنتجات', true)}
    ${chk('newarr', 'وصل حديثًا', true)}
    ${chk('community', 'زر المجتمع في الشريط السفلي', true)}
    ${chk('bottom', 'الكروت السفلية (تتبع، إرجاع، ...)', true)}
    <button class="btn w" id="sv" style="margin-top:10px">حفظ الإعدادات</button></div>`;
  $('sv').onclick = async () => {
    const f2 = { hero_title: $('s_ht').value.trim(), hero_sub: $('s_hs').value.trim() };
    ['discovery', 'newarr', 'community', 'bottom'].forEach(k => f2[k] = $('f_' + k).checked);
    const { error } = await sb.from('shop_settings').update({ shop_name: $('s_name').value.trim(), whatsapp: $('s_wa').value.replace(/\D/g, ''), features: f2 }).eq('id', 1);
    if (error) return toast('تعذر الحفظ'); toast('تم الحفظ ✓');
  };
};
V.cmt = async () => {
  const { data } = await sb.from('product_comments').select('*,products(name)').order('id', { ascending: false }).limit(100);
  $('main').innerHTML = (data || []).map(c => `<div class="c"><div class="r"><b>${esc(c.name)} — ${esc(c.products?.name)}</b><span class="${c.is_hidden ? 'bad' : ''}">${c.is_hidden ? 'مخفي' : 'ظاهر'}</span></div><div class="mut">${esc(c.body)}</div>
    ${c.reply ? `<div class="mut" style="margin-top:6px;border-right:3px solid #1e40af;padding-right:8px">ردّك: ${esc(c.reply)}</div>` : ''}
    <textarea id="rp${c.id}" rows="2" maxlength="500" placeholder="اكتب ردك...">${esc(c.reply || '')}</textarea>
    <div class="r" style="margin-top:6px"><button class="btn" onclick="cmtReply(${c.id})">حفظ الرد</button><button class="btn g" onclick="cmtSet(${c.id},${!c.is_hidden})">${c.is_hidden ? 'إظهار' : 'إخفاء'}</button><button class="btn g" onclick="cmtDel(${c.id})">حذف</button></div></div>`).join('') || '<p class="mut">لا توجد تعليقات</p>';
};
async function cmtReply(id) {
  const t = ($('rp' + id).value || '').trim();
  const { error } = await sb.from('product_comments').update({ reply: t || null, reply_at: t ? new Date().toISOString() : null }).eq('id', id);
  if (error) return toast('تعذر حفظ الرد');
  if (t) {
    const { data: cm } = await sb.from('product_comments').select('user_id,products(name)').eq('id', id).single();
    if (cm && cm.user_id) await sb.from('notifications').insert({ user_id: cm.user_id, title: 'رد على تعليقك', body: 'ردّ صاحب المحل على تعليقك' + (cm.products?.name ? ' على: ' + cm.products.name : '') });
  }
  toast(t ? 'تم حفظ الرد ✓' : 'تم حذف الرد'); V.cmt();
}
async function cmtSet(id, v) { await sb.from('product_comments').update({ is_hidden: v }).eq('id', id); V.cmt(); }
async function cmtDel(id) { if (!confirm('حذف التعليق؟')) return; await sb.from('product_comments').delete().eq('id', id); V.cmt(); }
async function revSet(id, v) { await sb.from('reviews').update({ is_approved: v }).eq('id', id); V.rev(); }
async function revDel(id) { if (!confirm('حذف التقييم؟')) return; await sb.from('reviews').delete().eq('id', id); V.rev(); }

/* ---------- العملاء ---------- */
const wa = p => { p = String(p || '').replace(/\D/g, ''); return p.startsWith('0') ? '20' + p.slice(1) : p; };
V.cust = async () => {
  const m = {}; let f = 0, n = 0;
  for (;;) {
    const { data, error } = await sb.from('orders').select('customer_id,customer_name,phone,total,status').order('id').range(f, f + 999);
    if (error) break;
    (data || []).forEach(o => { const k = o.customer_id || o.phone, c = m[k] = m[k] || { n: o.customer_name, p: o.phone, c: 0, t: 0 }; c.c++; if (!['rejected', 'cancelled'].includes(o.status)) c.t += Number(o.total); });
    n += (data || []).length;
    if (!data || data.length < 1000) break;
    f += 1000;
  }
  const l = Object.values(m).sort((x, y) => y.t - x.t);
  $('main').innerHTML = `<p class="mut">${l.length} عميل (من ${n} طلب)</p>` + l.map(c => `<div class="c"><div class="r"><b>${esc(c.n)}</b><span>${money(c.t)}</span></div><div class="r mut"><span>${esc(c.p)} • ${c.c} طلب</span><span><a href="tel:${esc(c.p)}">📞</a> <a href="https://wa.me/${wa(c.p)}" target="_blank">💬</a></span></div></div>`).join('') || '<p class="mut">لا يوجد عملاء بعد</p>';
};
/* ---------- نسخة احتياطية ---------- */
V.bk = async () => {
  $('main').innerHTML = `<div class="c"><h3>نسخة احتياطية</h3><p class="mut">تنزّل ملفًا فيه كل بيانات المتجر (المنتجات والطلبات والحجوزات والمصروفات...). احتفظ به على التابلت أو ارفعه على Google Drive. الصور لا تدخل فيه لأنها محفوظة على Supabase. يُفضّل نسخة كل أسبوع.</p><button class="btn w" id="bkb">⬇️ تنزيل نسخة احتياطية الآن</button><p class="mut" id="bks"></p></div>`;
  $('bkb').onclick = async () => {
    const T = ['shop_settings', 'profiles', 'categories', 'products', 'product_images', 'offers', 'delivery_zones', 'orders', 'order_items', 'reservations', 'payments', 'inventory_movements', 'expenses', 'notifications', 'favorites', 'product_comments', 'product_reactions', 'payment_proofs'], out = {}, bad = [];
    for (const n of T) {
      $('bks').textContent = 'جاري تجهيز: ' + n; let rows = [], f = 0;
      for (;;) { let q = sb.from(n).select('*'); if (n !== 'favorites') q = q.order('id'); const { data, error } = await q.range(f, f + 999); if (error) { bad.push(n); break; } rows = rows.concat(data); if (data.length < 1000) break; f += 1000; }
      out[n] = rows;
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({ date: new Date().toISOString(), data: out }, null, 1)], { type: 'application/json' })); a.download = 'store-backup-' + new Date().toISOString().slice(0, 10) + '.json'; a.click();
    $('bks').textContent = bad.length ? 'تم، لكن تعذّر: ' + bad.join(', ') : 'تم التنزيل ✓';
  };
};
start();
</script>
