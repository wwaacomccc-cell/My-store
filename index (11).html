<title>متجر الأدوات المنزلية</title>

<style>
:root{--bg:#eef3fb;--card:#fff;--tx:#14213d;--mut:#64748b;--pri:#1746b0;--pri2:#0f3a99;--acc:#e11d2e;--bd:#dde6f5}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--tx:#eef2fb;--mut:#9aa8c2;--pri:#4c86ff;--pri2:#8ab4ff;--acc:#ff5468;--bd:#22304a}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--tx)}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:10px 12px;display:flex;gap:8px;align-items:center}
header h1{font-size:17px;margin:0;white-space:nowrap}
#q{flex:1;min-width:0;padding:10px 12px;border:0;border-radius:10px;font-size:15px}
.ib{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;padding:9px 11px;font-size:15px;position:relative}
.ib b{position:absolute;top:-6px;left:-6px;background:var(--acc);border-radius:99px;font-size:11px;padding:1px 6px}
#cats{display:flex;gap:8px;overflow-x:auto;padding:10px 12px}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:8px 14px;font-size:14px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:4px 12px 12px}
@media(min-width:700px){#grid{grid-template-columns:repeat(4,1fr)}}
.p{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--bd);cursor:pointer;position:relative}
.p img,.ph{width:100%;aspect-ratio:1;object-fit:cover;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:34px}
.p div.i{padding:8px 10px}.nm{font-size:14px;height:38px;overflow:hidden}
.pr{font-weight:700;color:var(--pri2)}.old{color:var(--mut);text-decoration:line-through;font-size:12px;margin-inline-start:6px}
.tag{position:absolute;top:8px;right:8px;background:var(--acc);color:#fff;font-size:12px;border-radius:8px;padding:2px 8px}
.out{opacity:.55}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px;font-size:15px;width:100%;font-weight:600}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
#more{display:block;margin:6px auto 24px;width:200px}
#md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20;align-items:flex-end;justify-content:center}
#md.on{display:flex}
#bx{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
@media(min-width:700px){#md{align-items:center}#bx{border-radius:18px}}
input,select,textarea{width:100%;padding:11px;margin:5px 0;border:1px solid var(--bd);border-radius:10px;font-size:15px;background:var(--card);color:var(--tx);font-family:inherit}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:30}
h3{margin:4px 0 10px}.mut{color:var(--mut);font-size:13px}.x{float:left;background:none;border:0;font-size:24px;color:var(--tx)}
header{background:linear-gradient(135deg,#0f3a99,#1f64e0);box-shadow:0 4px 16px rgba(15,58,153,.25);padding:12px}
header h1{color:#ffd21f;font-size:18px;font-weight:800}
#q{background:#fff;color:#14213d;border-radius:12px}
.ib{border-radius:12px}
.chip{font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.chip.on{background:linear-gradient(135deg,#0f3a99,#1f64e0);border-color:transparent}
.p{border:0;border-radius:18px;box-shadow:0 2px 10px rgba(15,40,100,.12);transition:transform .15s}
.p:active{transform:scale(.97)}
.tag{background:var(--acc);border-radius:99px;font-weight:700}
.btn{background:linear-gradient(135deg,#0f3a99,#1f64e0);border-radius:14px;box-shadow:0 4px 12px rgba(31,100,224,.3)}
.btn.g{background:var(--card);box-shadow:none}
#bx{border-radius:24px 24px 0 0}
.sr{display:flex;gap:6px;padding:0 10px 10px;font-size:13px;align-items:center;flex-wrap:wrap}.sr span{cursor:pointer;padding:4px 9px;border-radius:99px;background:var(--bd);color:var(--tx)}.sr span.on{background:var(--pri);color:#fff}
.hrt{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.92);color:#e11d2e;border-radius:99px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:17px;z-index:2}
.ib b.nn{background:var(--acc)}

/* ===== واجهة جديدة: لافتة المحل + رف الأجهزة ===== */
:root{--navy:#0a2260;--sign:#12307f;--sun:#ffd21f;--steel:#cfe0fb}
body{font-family:'Cairo',system-ui,"Segoe UI",Tahoma,sans-serif}
.hero{background:linear-gradient(170deg,#0f3a99 0%,#12307f 55%,#0a2260 100%);color:#fff;padding:22px 16px 0;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(70% 62% at 50% 100%,rgba(130,180,255,.45),transparent 72%),repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 2px,transparent 2px 38px);pointer-events:none}
.hero-t{position:relative;text-align:center;max-width:640px;margin:0 auto}
.hero h2{margin:0;font-size:clamp(38px,12vw,68px);line-height:1.05;font-weight:900;color:var(--sun);letter-spacing:-.5px;text-shadow:0 3px 0 rgba(10,34,96,.55)}
.hero p{margin:8px 0 0;font-size:clamp(15px,4.2vw,20px);font-weight:600;color:#e7efff}
.hero-a{display:flex;gap:10px;justify-content:center;margin:16px 0 4px}
.hb{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:99px;font-weight:800;font-size:15px;text-decoration:none;border:2px solid rgba(255,255,255,.55);color:#fff}
.hb.y{background:var(--sun);color:var(--navy);border-color:var(--sun)}
.shelf{position:relative;display:flex;align-items:flex-end;justify-content:space-between;max-width:640px;margin:18px auto 0;padding:0 2px}
.shelf svg{display:block;flex:none;height:auto;transform-origin:50% 100%}
.shelf .fr{width:19%}.shelf .st{width:25%}.shelf .wa{width:21%}.shelf .bl{width:11%}.shelf .ke{width:21%}.shelf .fa{display:none}
@media(min-width:600px){.shelf .fr{width:16%}.shelf .st{width:21%}.shelf .wa{width:17%}.shelf .bl{width:9%}.shelf .ke{width:17%}.shelf .fa{display:block;width:8%}}
.board{height:16px;background:linear-gradient(#eef4ff,#8fb0e6);box-shadow:0 -3px 0 var(--sun)}
.shelf svg{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.shelf svg{animation:none}}
.perks{display:flex;justify-content:center;background:var(--card);border-bottom:1px solid var(--bd)}
.perks div{flex:1;max-width:210px;text-align:center;padding:11px 4px;font-size:13px;font-weight:700;color:var(--tx);line-height:1.35}
.perks div+div{border-right:1px solid var(--bd)}
.perks span{display:block;font-size:20px;margin-bottom:1px}
.sec{font-size:22px;font-weight:900;margin:14px 14px 0;color:var(--tx);display:flex;align-items:center;gap:10px}
.sec:after{content:"";flex:1;height:4px;border-radius:4px;background:linear-gradient(90deg,transparent,var(--sun))}
header h1{font-weight:900}
.chip{font-family:inherit;font-weight:700}
.chip i{font-style:normal;margin-inline-end:5px}
.p{background:var(--card)}
.p img,.ph{background:#fff}
.nm{font-weight:700;line-height:1.35}
.pr{font-size:17px;font-weight:900;color:var(--pri)}
.tag{font-weight:800}
#ft{padding:22px 16px 34px;text-align:center;background:var(--navy);color:#cfe0fb;font-size:14px;line-height:1.9}
#ft b{color:var(--sun);font-size:18px;font-weight:900}
#ft a{color:#fff;font-weight:800;text-decoration:none}
</style>

<script>

const $ = id => document.getElementById(id), PAGE = 24;

let cats = [], offers = [], prods = {}, cart = {}, page = 0, cat = null, term = '', user = null, zones = [], settings = {};

function toast(t) { const e = $('toast'); e.textContent = t; e.style.display = 'block'; setTimeout(() => e.style.display = 'none', 2600); }
function open_(h) { $('bx').innerHTML = '<button class="x" onclick="closeM()">×</button>' + h; $('md').classList.add('on'); }
function closeM() { $('md').classList.remove('on'); }

function price(p) {
  let d = 0;
  offers.forEach(o => { if (o.product_id === p.id || (o.category_id && o.category_id === p.category_id)) d = Math.max(d, Number(o.discount_percent)); });
  return { now: Math.round(p.price * (1 - d / 100) * 100) / 100, old: d ? p.price : null, d };
}
function saveCart() { try { localStorage.setItem('cart', JSON.stringify(cart)); } catch (e) {} $('cn').textContent = Object.values(cart).reduce((a, b) => a + b, 0); }

async function init() {
  const { data: { session } } = await sb.auth.getSession(); user = session?.user || null;
  sb.auth.onAuthStateChange((_, s) => { user = s?.user || null; setTimeout(() => { loadFavs(); loadMyR(); }, 0); });
  const [c, o, z, s] = await Promise.all([

  if (settings.whatsapp) { $('hwa').href = 'https://wa.me/' + settings.whatsapp; $('hwa').style.display = ''; }
  drawCats(); saveCart(); load(true);
}
const CI = [['ثلاج','❄️'],['تلاج','❄️'],['بوتجاز','🔥'],['غسال','🫧'],['مطبخ','🍳'],['كهرب','🔌'],['اجهز','🔌'],['أجهز','🔌'],['مروح','🌀'],['تكييف','🌀'],['سخان','♨️'],['اكواب','🥤'],['أكواب','🥤'],['طقم','🍽️'],['حلل','🍲'],['اطباق','🍽️'],['أطباق','🍽️'],['نظاف','🧼'],['تنظيف','🧼'],['اضاء','💡'],['إضاء','💡'],['عفش','🛏️'],['حمام','🚿'],['بلاستيك','🧺'],['خلاط','🥤'],['غلاي','🫖'],['شاي','🫖']];
const ci = n => { const t = String(n || ''); const m = CI.find(x => t.includes(x[0])); return m ? m[1] : '🏷️'; };
function drawCats() {
  const top = cats.filter(c => !c.parent_id);
  $('cats').innerHTML = `<button class="chip ${cat === null ? 'on' : ''}" data-c="">الكل</button>` +

  $('cats').querySelectorAll('button').forEach(b => b.onclick = () => { cat = b.dataset.c ? +b.dataset.c : null; drawCats(); load(true); });

async function load(reset) {

  let q = sb.from('products').select('id,code,name,description,price,stock,category_id,product_images(url,sort_order)').eq('is_active', true).order('id', { ascending: false }).range(page * PAGE, page * PAGE + PAGE - 1);
  if (cat !== null) { const ids = [cat, ...cats.filter(c => c.parent_id === cat).map(c => c.id)]; q = q.in('category_id', ids); }
  if (term) { const t = term.replace(/[%,()]/g, ' '); q = q.or(`name.ilike.%${t}%,code.ilike.%${t}%`); }
  const { data, error } = await q;

}
async function loadMyR() {

  document.querySelectorAll('[data-l]').forEach(e => paintStats(Number(e.dataset.l)));

async function refreshStats(ids) {

  const { data } = await sb.rpc('products_stats', { p_ids: ids });

}

function add(id) { const p = prods[id]; const n = (cart[id] || 0) + 1; if (n > p.stock) return toast('الكمية المتاحة ' + p.stock); cart[id] = n; saveCart(); toast('تمت الإضافة ✓'); closeM(); }

function showCart() {
  const ids = Object.keys(cart).filter(i => prods[i]); let sub = 0;
  if (!ids.length) return open_('<h3>🛒 السلة</h3><p class="mut">السلة فارغة</p>');

  const { data: fv0 } = await sb.from('favorites').select('product_id'); const fids = (fv0 || []).map(f => f.product_id); const { data: fp } = fids.length ? await sb.from('products').select('id,name').in('id', fids) : { data: [] }; const fv = (fp || []).map(p => ({ product_id: p.id, products: { name: p.name } }));
  const { data: rs } = await sb.from('reservations').select('id,quantity,unit_price,status,products(name),payments(amount)').order('id', { ascending: false }).limit(20);
  open_(`<h3>طلباتي</h3>${(data || []).map(o => `<div class="row"><div>طلب #${o.id}<div class="mut">${new Date(o.created_at).toLocaleDateString('ar-EG')}</div></div><div>${money(o.total)}<div class="mut">${ST[o.status] || o.status}</div>${o.status === 'pending' && settings.vodafone_cash ? `<a class="mut" style="text-decoration:underline" onclick="proofForm('order',${o.id})">📎 رفع صورة التحويل</a>` : ''}</div></div>`).join('') || '<p class="mut">لا توجد طلبات</p>'}
  <h3 style="margin-top:14px">حجوزاتي</h3>${(rs || []).map(r => { const paid = (r.payments || []).reduce((a, b) => a + Number(b.amount), 0), tot = r.unit_price * r.quantity; return `<div class="row"><div>${esc(r.products?.name)} × ${r.quantity}<div class="mut">${RS[r.status] || r.status}</div></div><div style="text-align:left">الإجمالي ${money(tot)}<div class="mut">العربون المدفوع ${money(paid)} • المتبقي ${money(tot - paid)}</div>${(r.status === 'pending' || r.status === 'confirmed') && settings.vodafone_cash ? `<a class="mut" style="text-decoration:underline" onclick="proofForm('reservation',${r.id})">📎 رفع صورة التحويل</a>` : ''}</div></div>`; }).join('') || '<p class="mut">لا توجد حجوزات</p>'}
  <h3 style="margin-top:14px">مفضلتي</h3>${(fv || []).map(f => `<div class="row" data-n="${esc(f.products?.name)}" onclick="goFav(this.dataset.n)"><div>♥ ${esc(f.products?.name)}</div></div>`).join('') || '<p class="mut">لا توجد منتجات مفضلة</p>'}
  ${settings.whatsapp ? `<a href="https://wa.me/${esc(settings.whatsapp)}" target="_blank"><button class="btn g" style="margin-top:10px">💬 تواصل مع المحل</button></a>` : ''}
  <button class="btn g" style="margin-top:8px" id="lo">تسجيل الخروج</button>`);
  $('lo').onclick = async () => { await sb.auth.signOut(); user = null; closeM(); toast('تم الخروج'); };
}
async function reserve(id) {
  if (!user) return authForm('سجّل الدخول لحجز المنتج', () => reserve(id));
  const p = prods[id], pr = price(p), pc = Number(settings.default_deposit_percent || 20);
  const { data: pf } = await sb.from('profiles').select('full_name,phone').eq('id', user.id).single();
  open_(`<h3>حجز: ${esc(p.name)}</h3><p class="mut">العربون المطلوب (${pc}%): ${money(pr.now * pc / 100)} — والباقي عند الاستلام</p>${settings.vodafone_cash ? `<p class="mut">يمكنك دفع العربون عبر فودافون كاش على رقم <b>${esc(settings.vodafone_cash)}</b> وإرسال صورة التحويل للمحل.</p>` : ''}
  <input id="rn" placeholder="الاسم" value="${esc(pf?.full_name)}"><input id="rp" type="tel" placeholder="الهاتف" value="${esc(pf?.phone)}"><button class="btn" id="rg">تأكيد الحجز</button>`);
  $('rg').onclick = async () => {
    if (!$('rn').value.trim() || !$('rp').value.trim()) return toast('أكمل البيانات');
    const exp = new Date(Date.now() + (settings.reservation_days || 3) * 864e5).toISOString();
    const { data: rv, error } = await sb.from('reservations').insert({ customer_id: user.id, customer_name: $('rn').value.trim(), phone: $('rp').value.trim(), product_id: id, quantity: 1, unit_price: pr.now, deposit_required: Math.round(pr.now * pc) / 100, expires_at: exp }).select('id').single();
    if (error) return toast('تعذر الحجز'); open_('<h3>✅ تم إرسال طلب الحجز</h3><p class="mut">سيتواصل معك المحل لتأكيده واستلام العربون.</p>' + (settings.vodafone_cash ? '<button class="btn" id="pp">📎 رفع صورة تحويل العربون</button>' : '')); if (settings.vodafone_cash) $('pp').onclick = () => proofForm('reservation', rv.id);
  };
}

/* ---- المفضلة والإشعارات ---- */
const favs = new Set();
async function loadFavs() {
  favs.clear();
  if (user) { const { data } = await sb.from('favorites').select('product_id'); (data || []).forEach(f => favs.add(f.product_id)); }
  document.querySelectorAll('[data-h]').forEach(e => e.textContent = favs.has(Number(e.dataset.h)) ? '♥' : '♡');
}
async function toggleFav(id) {
  if (!user) return authForm('سجّل الدخول لإضافة المفضلة', () => toggleFav(id));
  if (favs.has(id)) { await sb.from('favorites').delete().eq('product_id', id).eq('user_id', user.id); favs.delete(id); }
  else { const { error } = await sb.from('favorites').insert({ user_id: user.id, product_id: id }); if (error) return toast('تعذر الحفظ'); favs.add(id); }
  document.querySelectorAll(`[data-h="${id}"]`).forEach(e => e.textContent = favs.has(id) ? '♥' : '♡');
  document.querySelectorAll(`[data-hb="${id}"]`).forEach(e => e.textContent = favs.has(id) ? '♥ في المفضلة' : '♡ أضف للمفضلة');
}
function goFav(n) { closeM(); $('q').value = n; term = n; load(true); }
let notifs = [];
const seen = () => { try { return Number(localStorage.getItem('seenN') || 0); } catch (e) { return 0; } };
async function loadNotifs() {
  const { data } = await sb.from('notifications').select('id,title,body,created_at').order('id', { ascending: false }).limit(20);
  notifs = data || []; const n = notifs.filter(x => x.id > seen()).length, b = $('nn');
  b.textContent = n; b.style.display = n ? 'block' : 'none';
}
function showNotifs() {
  open_(`<h3>الإشعارات</h3>${notifs.map(n => `<div class="row"><div><b>${esc(n.title)}</b><div class="mut">${esc(n.body)}</div></div><div class="mut">${new Date(n.created_at).toLocaleDateString('ar-EG')}</div></div>`).join('') || '<p class="mut">لا توجد إشعارات</p>'}`);
  try { if (notifs[0]) localStorage.setItem('seenN', notifs[0].id); } catch (e) {}
  $('nn').style.display = 'none';
}
$('nb').onclick = showNotifs;

/* ---- التقييمات ---- */
async function loadReviews() {
  const { data } = await sb.from('reviews').select('name,rating,comment').eq('is_approved', true).order('id', { ascending: false }).limit(20);
  const l = data || [], avg = l.length ? (l.reduce((a, r) => a + r.rating, 0) / l.length).toFixed(1) : '';
  $('rv').innerHTML = `<h3>⭐ آراء العملاء ${l.length ? `<span class="mut">(${avg} من 5 — ${l.length} تقييم)</span>` : ''}</h3>` + l.map(r => `<div class="p" style="cursor:default;padding:10px;margin-bottom:8px"><b>${esc(r.name)}</b> <span style="color:#f5a623">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span><div class="mut">${esc(r.comment)}</div></div>`).join('') + `<button class="btn g" onclick="reviewForm()">✍️ اكتب رأيك في المحل</button>`;
}
async function reviewForm() {
  if (!user) return authForm('سجّل الدخول لكتابة رأيك', reviewForm);
  const { data: pf } = await sb.from('profiles').select('full_name').eq('id', user.id).single();
  open_(`<h3>رأيك في المحل</h3><select id="rr"><option value="5">★★★★★ ممتاز</option><option value="4">★★★★ جيد جدًا</option><option value="3">★★★ جيد</option><option value="2">★★ مقبول</option><option value="1">★ سيء</option></select><input id="rname" placeholder="الاسم" value="${esc(pf?.full_name)}"><textarea id="rc" rows="3" placeholder="اكتب تعليقك (اختياري)"></textarea><button class="btn" id="rs">إرسال التقييم</button>`);
  $('rs').onclick = async () => {
    const n = $('rname').value.trim(); if (!n) return toast('اكتب اسمك');
    const { error } = await sb.from('reviews').upsert({ user_id: user.id, name: n, rating: +$('rr').value, comment: $('rc').value.trim(), is_approved: false }, { onConflict: 'user_id' });
    if (error) return toast('تعذر الإرسال'); open_('<h3>✅ شكرًا لرأيك</h3><p class="mut">سيظهر تقييمك بعد مراجعة المحل له.</p>');
  };
}

let tm; $('q').oninput = e => { clearTimeout(tm); tm = setTimeout(() => { term = e.target.value.trim(); load(true); }, 350); };
$('more').onclick = () => { page++; load(false); };
$('cartb').onclick = showCart; $('acc').onclick = account;
init().then(() => { loadFavs(); loadNotifs(); loadReviews(); });
</script>
</body>
